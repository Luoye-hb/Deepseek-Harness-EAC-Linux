name: Tauri migration validation

on:
  push:
    branches: [main]
    paths:
      - 'dsh-desktop/**'
      - '.github/workflows/tauri.yml'
  pull_request:
    paths:
      - 'dsh-desktop/**'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared TypeScript and Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  windows-nsis:
    name: Tauri Windows NSIS build
    needs: shared
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run fetch-node
      - run: npm run fetch-npm
      - run: npm run tauri:staging
      - run: node scripts/prepare-tauri-config.mjs
      - run: npx tauri build --config src-tauri/tauri.generated.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-nsis-${{ github.run_id }}
          path: dsh-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  linux-tauri:
    name: Tauri Debian 12 package build and audit
    needs: shared
    runs-on: ubuntu-latest
    container:
      image: debian:12
    defaults:
      run:
        shell: bash
        working-directory: dsh-desktop
    steps:
      - name: Install Debian 12 Tauri dependencies
        working-directory: /
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl build-essential file git pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm cpio libarchive-tools xz-utils zstd
      - uses: actions/checkout@v4
      - name: Install Rust
        working-directory: /
        run: |
          set -eux
          curl --fail --silent --show-error https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install official Node 24.19.0
        working-directory: /
        run: |
          set -eux
          curl --fail --silent --show-error --location \
            https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz \
            -o /tmp/node.tar.xz
          curl --fail --silent --show-error --location \
            https://nodejs.org/dist/v24.19.0/SHASUMS256.txt -o /tmp/SHASUMS256.txt
          grep ' node-v24.19.0-linux-x64.tar.xz$' /tmp/SHASUMS256.txt | \
            sha256sum --check --strict
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version | grep -Fx v24.19.0
      - run: npm ci
      - run: npm run build
      - run: npm run fetch-node
      - run: npm run fetch-npm
      - run: npm run tauri:staging
      - run: node scripts/prepare-tauri-config.mjs
      - run: npx tauri build --config src-tauri/tauri.generated.conf.json --bundles deb,rpm,appimage
      - name: Audit generated Tauri packages
        run: |
          set -eux
          mapfile -t packages < <(find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print)
          test "${#packages[@]}" -ge 3
          bash scripts/audit-tauri-linux-package.sh "${packages[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-${{ github.run_id }}
          path: |
            dsh-desktop/src-tauri/target/release/bundle/deb/*.deb
            dsh-desktop/src-tauri/target/release/bundle/rpm/*.rpm
            dsh-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Archive Debian-built pacman inputs
        run: |
          set -eux
          rm -rf /tmp/tauri-pacman-inputs
          mkdir -p /tmp/tauri-pacman-inputs/src-tauri/target/release
          cp src-tauri/target/release/deepseek-harness-eac \
            /tmp/tauri-pacman-inputs/src-tauri/target/release/
          cp -a .tauri-staging /tmp/tauri-pacman-inputs/
          tar --zstd -cf /tmp/tauri-pacman-inputs.tar.zst \
            -C /tmp/tauri-pacman-inputs .
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-pacman-inputs-${{ github.run_id }}
          path: /tmp/tauri-pacman-inputs.tar.zst
          if-no-files-found: error
          retention-days: 7

  linux-pacman:
    name: Tauri Arch pacman build and audit
    needs: linux-tauri
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
        working-directory: dsh-desktop
    steps:
      - name: Install Arch Tauri dependencies
        working-directory: /
        run: |
          set -eux
          pacman -Sy --noconfirm --needed \
            ca-certificates curl file git gtk3 webkit2gtk-4.1 \
            libayatana-appindicator librsvg patchelf rpm cpio libarchive xz zstd
      - uses: actions/checkout@v4
      - name: Install official Node 24.19.0
        working-directory: /
        run: |
          set -eux
          curl --fail --silent --show-error --location \
            https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz \
            -o /tmp/node.tar.xz
          curl --fail --silent --show-error --location \
            https://nodejs.org/dist/v24.19.0/SHASUMS256.txt -o /tmp/SHASUMS256.txt
          grep ' node-v24.19.0-linux-x64.tar.xz$' /tmp/SHASUMS256.txt | \
            sha256sum --check --strict
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version | grep -Fx v24.19.0
      - uses: actions/download-artifact@v4
        with:
          name: tauri-pacman-inputs-${{ github.run_id }}
          path: /tmp/tauri-pacman-download
      - name: Restore Debian-built Tauri inputs
        run: |
          set -eux
          tar --zstd -xf /tmp/tauri-pacman-download/tauri-pacman-inputs.tar.zst
      - name: Build pacman package as an unprivileged user
        run: |
          set -eux
          repo_dir="$PWD"
          useradd --create-home --shell /bin/bash dsh-builder
          chown -R dsh-builder:dsh-builder "$GITHUB_WORKSPACE"
          su dsh-builder -s /bin/bash -c "cd '$repo_dir' && scripts/build-tauri-pacman.sh"
      - name: Audit generated pacman package
        run: |
          set -eux
          mapfile -t packages < <(find dist/tauri -type f -name '*.pkg.tar.*' -print)
          test "${#packages[@]}" -eq 1
          bash scripts/audit-tauri-linux-package.sh "${packages[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-pacman-${{ github.run_id }}
          path: dsh-desktop/dist/tauri/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 7
